services:
  web:
    build: .
    image: fp-portal:latest
    container_name: fp-portal
    ports:
      # Порт доступен только с этого компьютера.
      - "127.0.0.1:5001:5001"
    volumes:
      # База и загруженные файлы хранятся в каталоге DB рядом с проектом.
      # Это упрощает резервное копирование данных средствами Windows.
      - ./DB:/app/app/data
    environment:
      # Секрет хранится локально в .env и не попадает в Git.
      - FP_PORTAL_SECRET=${FP_PORTAL_SECRET:?Укажите FP_PORTAL_SECRET в файле .env}

      # Ollama (чат «Спросить портал») — нужна локальная установка Ollama.
      # macOS / Windows: host.docker.internal — это и есть ваш компьютер.
      # Linux: замените host.docker.internal на 172.17.0.1 (обычный адрес хоста).
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen3:8b
    extra_hosts:
      # Корпоративный SMB-сервер — контейнер не видит внутренний DNS Диасофт
      - "ditest:10.20.81.65"
      - "ditest.diasoft.ru:10.20.81.65"
    restart: unless-stopped
